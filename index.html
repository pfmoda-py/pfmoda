
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF Moda | Boutique Premium</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header / Barra de Navegación -->
    <header>
        <div class="logo">PF <span>Moda</span></div>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#catalogo">Catálogo</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main>
        <h1 class="section-title">Novedades Exclusivas</h1>
        
        <!-- Grid donde se pintarán los productos con JavaScript -->
        <div id="productos-contenedor" class="productos-grid">
            <p style="text-align: center; grid-column: 1 / -1; color: #666;">Cargando catálogo...</p>
        </div>
    </main>

    <!-- Scripts JavaScript -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
